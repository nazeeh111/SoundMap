name: Offline evaluation kernels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install observed offline-kernel dependencies
        run: "python -m pip install --only-binary=:all: -r requirements-kernels.txt"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check command dispatch without devices
        run: python -m unittest discover -s tests -v
      - name: Check ideal synthetic evaluation coordinates
        run: python scripts/verify_localization.py --work-dir .verification/localization --output .verification/localization-result.json
