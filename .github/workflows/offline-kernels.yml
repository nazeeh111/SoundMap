name: Offline evaluation kernels

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      NUMBA_NUM_THREADS: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install observed offline-kernel dependencies
        run: "python -m pip install --only-binary=:all: -r requirements-kernels.txt"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check command dispatch without devices
        run: python -m unittest discover -s tests -v
      - name: Check ideal synthetic evaluation coordinates
        run: python scripts/verify_localization.py --work-dir .verification/localization --output .verification/localization-result.json
